name: Deploy zu Ionos

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:hetzner

      - name: Deploy via SFTP
        run: |
          sudo apt-get install -y lftp
          lftp sftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_SERVER }} -e "set sftp:auto-confirm yes; mirror -R out/ /; bye"
