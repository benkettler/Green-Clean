name: Deploy zu Ionos

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:hetzner

      - name: Deploy via SFTP
        timeout-minutes: 10
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          sudo apt-get install -y lftp sshpass
          lftp -c "set sftp:auto-confirm yes; set sftp:connect-program 'sshpass -e ssh -oStrictHostKeyChecking=no'; set net:timeout 60; open -u $SFTP_USER sftp://$SFTP_SERVER; mirror -R --transfer-all --parallel=5 out/ /; bye"
