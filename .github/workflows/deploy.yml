name: Deploy zu Ionos

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:hetzner

      - name: Deploy via SFTP
        env:
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          echo "machine $SFTP_SERVER login $SFTP_USER password $SFTP_PASS" > ~/.netrc
          chmod 600 ~/.netrc
          lftp -c "set sftp:auto-confirm yes; set net:timeout 30; open sftp://$SFTP_SERVER; mirror -R out/ /; bye"
          rm ~/.netrc
